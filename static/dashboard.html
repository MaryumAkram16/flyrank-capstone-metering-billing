<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Usage Ledger — Metering &amp; Billing Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12161d;
    --surface: #1a2029;
    --surface-2: #212836;
    --hairline: #2c3444;
    --paper: #edeae1;
    --paper-dim: #9099ab;
    --amber: #e3a13c;
    --amber-dim: #6b5228;
    --sage: #7aa88a;
    --rust: #c9622b;
    --brick: #c1483f;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(227,161,60,0.05), transparent 40%),
      var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 48px 20px 80px;
    display: flex;
    justify-content: center;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  .ledger {
    width: 100%;
    max-width: 560px;
  }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .masthead h1 {
    font-size: 15px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0;
    color: var(--paper);
    font-weight: 600;
  }

  .masthead .sub {
    font-size: 11px;
    color: var(--paper-dim);
    letter-spacing: 0.08em;
  }

  .tenant-picker {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tenant-picker input {
    width: 70px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--paper);
    padding: 7px 10px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .tenant-picker input:focus { outline: 1px solid var(--amber); }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--paper);
    border: 1px solid var(--hairline);
    padding: 8px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.05s ease;
  }

  button:hover { border-color: var(--amber-dim); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  button.primary {
    background: var(--amber);
    color: #1a1204;
    border-color: var(--amber);
  }
  button.primary:hover { border-color: var(--paper); }

  /* --- the receipt card, with a torn top edge as the signature element --- */
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    position: relative;
    margin-top: 22px;
    padding: 26px 26px 20px;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -9px;
    left: 0;
    right: 0;
    height: 9px;
    background:
      radial-gradient(circle at 8px 9px, transparent 7px, var(--surface) 7.5px) repeat-x;
    background-size: 16px 9px;
  }

  .row-plan {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .plan-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 3px 9px;
    border-radius: var(--radius);
    border: 1px solid var(--hairline);
    color: var(--paper-dim);
  }
  .plan-badge.pro { color: var(--amber); border-color: var(--amber-dim); }

  .meter { margin-bottom: 18px; }

  .meter-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin-bottom: 6px;
  }

  .meter-label .reading {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--paper);
    letter-spacing: 0;
    font-size: 12px;
  }

  .gauge {
    position: relative;
    height: 14px;
    background: var(--ink);
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--hairline);
  }

  .gauge .fill {
    height: 100%;
    background: var(--sage);
    transition: width 0.4s ease;
  }
  .gauge .fill.warning { background: var(--rust); }
  .gauge .fill.critical { background: var(--brick); }

  .gauge .ticks {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      90deg, rgba(18,22,29,0.5) 0, rgba(18,22,29,0.5) 1px,
      transparent 1px, transparent 10%
    );
  }

  .divider {
    border: none;
    border-top: 1px dashed var(--hairline);
    margin: 18px 0;
  }

  .cost-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
  .cost-line .label { color: var(--paper-dim); letter-spacing: 0.04em; white-space: nowrap; }
  .cost-line .dots { flex: 1; border-bottom: 2px dotted var(--hairline); transform: translateY(-4px); }
  .cost-line .value { color: var(--amber); font-weight: 600; white-space: nowrap; }

  .alerts { margin-top: 16px; }
  .alert {
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 1px solid var(--hairline);
    border-left: 3px solid var(--rust);
    background: rgba(201,98,43,0.08);
    color: var(--paper);
    margin-bottom: 6px;
  }
  .alert.critical { border-left-color: var(--brick); background: rgba(193,72,63,0.1); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 20px;
  }

  .log-title {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--paper-dim);
    margin: 28px 0 8px;
  }

  .log {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--paper-dim);
    max-height: 220px;
    overflow-y: auto;
  }
  .log .entry.ok { color: var(--sage); }
  .log .entry.warn { color: var(--rust); }
  .log .entry.err { color: var(--brick); }
  .log .entry .time { color: var(--paper-dim); margin-right: 8px; }

  .empty { color: var(--paper-dim); font-size: 12px; font-style: italic; }

  @media (prefers-reduced-motion: reduce) {
    .gauge .fill { transition: none; }
  }
</style>
</head>
<body>
  <div class="ledger">
    <div class="masthead">
      <h1>Usage Ledger</h1>
      <span class="sub mono">FakeStripe · test mode</span>
    </div>
    <div class="tenant-picker">
      <input id="tenantId" type="number" value="1" min="1" aria-label="Tenant ID" />
      <button id="loadBtn">Load tenant</button>
    </div>

    <div class="card">
      <div class="row-plan">
        <span class="plan-badge mono" id="planBadge">—</span>
        <span class="sub mono" id="tenantLabel">tenant —</span>
      </div>

      <div class="meter">
        <div class="meter-label">
          <span>API calls</span>
          <span class="reading" id="apiReading">— / —</span>
        </div>
        <div class="gauge"><div class="fill" id="apiFill" style="width:0%"></div><div class="ticks"></div></div>
      </div>

      <div class="meter">
        <div class="meter-label">
          <span>AI tokens</span>
          <span class="reading" id="tokenReading">— / —</span>
        </div>
        <div class="gauge"><div class="fill" id="tokenFill" style="width:0%"></div><div class="ticks"></div></div>
      </div>

      <hr class="divider" />

      <div class="cost-line">
        <span class="label">COST THIS MONTH</span>
        <span class="dots"></span>
        <span class="value" id="costValue">$0.000000</span>
      </div>

      <div class="alerts" id="alerts"></div>

      <div class="actions">
        <button id="meterApiBtn">Meter 1 API call</button>
        <button id="meterTokensBtn">Meter 20,000 AI tokens</button>
        <button class="primary" id="upgradeBtn">Upgrade to Pro</button>
      </div>
    </div>

    <div class="log-title mono">Activity</div>
    <div class="log" id="log"><div class="empty">No activity yet — load a tenant to begin.</div></div>
  </div>

<script>
const state = { tenantId: 1, usage: null };

function fmt(n) { return Number(n).toLocaleString(); }

function timeNow() {
  return new Date().toLocaleTimeString([], { hour12: false });
}

function logEntry(text, kind = '') {
  const log = document.getElementById('log');
  if (log.querySelector('.empty')) log.innerHTML = '';
  const div = document.createElement('div');
  div.className = `entry ${kind}`;
  div.innerHTML = `<span class="time">${timeNow()}</span>${text}`;
  log.prepend(div);
  while (log.children.length > 15) log.removeChild(log.lastChild);
}

function fillClass(used, limit) {
  if (limit <= 0) return '';
  const pct = used / limit;
  if (pct >= 1) return 'critical';
  if (pct >= 0.8) return 'warning';
  return '';
}

function renderUsage(data) {
  state.usage = data;
  document.getElementById('tenantLabel').textContent = `tenant ${data.tenant_id}`;

  const isPro = (data.plan_name || '').toLowerCase() === 'pro';
  const badge = document.getElementById('planBadge');
  badge.textContent = (data.plan_name || '—').toUpperCase();
  badge.classList.toggle('pro', isPro);

  const api = data.api_calls, tok = data.ai_tokens;
  document.getElementById('apiReading').textContent = `${fmt(api.used)} / ${fmt(api.limit)}`;
  document.getElementById('tokenReading').textContent = `${fmt(tok.used)} / ${fmt(tok.limit)}`;

  const apiFill = document.getElementById('apiFill');
  apiFill.style.width = `${Math.min(100, (api.used / api.limit) * 100)}%`;
  apiFill.className = `fill ${fillClass(api.used, api.limit)}`;

  const tokFill = document.getElementById('tokenFill');
  tokFill.style.width = `${Math.min(100, (tok.used / tok.limit) * 100)}%`;
  tokFill.className = `fill ${fillClass(tok.used, tok.limit)}`;

  document.getElementById('costValue').textContent = data.cost.display;

  const alertsEl = document.getElementById('alerts');
  alertsEl.innerHTML = '';
  (data.alerts || []).forEach(a => {
    const div = document.createElement('div');
    div.className = `alert ${a.level}`;
    div.textContent = `⚠ ${a.message}`;
    alertsEl.appendChild(div);
  });

  document.getElementById('upgradeBtn').disabled = isPro;
  document.getElementById('upgradeBtn').textContent = isPro ? 'Pro plan active' : 'Upgrade to Pro';
}

async function loadUsage() {
  const res = await fetch(`/usage?tenant_id=${state.tenantId}`);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    logEntry(`GET /usage &rarr; ${res.status} ${body.detail || ''}`, 'err');
    return;
  }
  renderUsage(await res.json());
}

async function meterApiCall() {
  const key = crypto.randomUUID();
  const res = await fetch('/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_id: state.tenantId, idempotency_key: key, usage_type: 'api_call' }),
  });
  const body = await res.json();
  if (res.ok) {
    logEntry(`POST /generate &rarr; 200 &middot; api_call &middot; ${body.cost_display}`, 'ok');
  } else {
    logEntry(`POST /generate &rarr; ${res.status} &middot; ${body.detail}`, res.status === 429 ? 'warn' : 'err');
  }
  loadUsage();
}

async function meterTokens() {
  const key = crypto.randomUUID();
  const res = await fetch('/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tenant_id: state.tenantId,
      idempotency_key: key,
      usage_type: 'ai_tokens',
      metadata: { input_tokens: 10000, cached_input_tokens: 5000, output_tokens: 4000, reasoning_tokens: 1000 },
    }),
  });
  const body = await res.json();
  if (res.ok) {
    logEntry(`POST /generate &rarr; 200 &middot; ai_tokens &middot; ${body.cost_display}`, 'ok');
  } else {
    logEntry(`POST /generate &rarr; ${res.status} &middot; ${body.detail}`, res.status === 429 ? 'warn' : 'err');
  }
  loadUsage();
}

async function upgradeToPro() {
  const checkoutRes = await fetch('/checkout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenant_id: state.tenantId, plan_name: 'Pro' }),
  });
  if (!checkoutRes.ok) { logEntry('POST /checkout &rarr; failed', 'err'); return; }
  const session = await checkoutRes.json();
  logEntry(`POST /checkout &rarr; 200 &middot; session ${session.id.slice(0, 18)}&hellip;`, 'ok');

  const payRes = await fetch(`${session.url}`, { method: 'POST' });
  const payBody = await payRes.json();
  logEntry(`POST ${session.url} &rarr; 200 &middot; event signed`, 'ok');

  // Send the RAW payload string exactly as received — re-serializing a parsed
  // object with JSON.stringify would produce different bytes than what the
  // server signed, and the signature check would fail. See app/main.py.
  const whRes = await fetch('/webhooks/stripe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Stripe-Signature': payBody.stripe_signature },
    body: payBody.payload,
  });
  const whBody = await whRes.json();
  if (whRes.ok) {
    logEntry(`POST /webhooks/stripe &rarr; 200 &middot; ${whBody.status}`, 'ok');
  } else {
    logEntry(`POST /webhooks/stripe &rarr; ${whRes.status}`, 'err');
  }
  loadUsage();
}

document.getElementById('loadBtn').addEventListener('click', () => {
  state.tenantId = Number(document.getElementById('tenantId').value) || 1;
  loadUsage();
});
document.getElementById('meterApiBtn').addEventListener('click', meterApiCall);
document.getElementById('meterTokensBtn').addEventListener('click', meterTokens);
document.getElementById('upgradeBtn').addEventListener('click', upgradeToPro);

loadUsage();
</script>
</body>
</html>
